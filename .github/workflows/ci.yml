name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install core dependencies
        run: python -m pip install -r requirements-core.txt
      - name: Check repository scope
        run: python scripts/check_repository.py
      - name: Verify project
        run: python verify_project.py
