[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "carmaker-camerarsi-recorder"
version = "1.5.0"
description = "Multi-camera CameraRSI recorder for CarMaker and MovieNX"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "CarMaker CameraRSI Recorder contributors" }
]
dependencies = [
  "numpy>=1.24,<3",
  "opencv-python>=4.8,<5"
]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]
build = ["PySide6>=6.6,<7", "pyinstaller>=6,<7"]

[tool.setuptools.packages.find]
include = ["carmaker_recorder*", "carmaker_gui*"]
